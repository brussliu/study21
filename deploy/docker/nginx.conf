# Study 2.1 — nginx（容器内）：PC 前端 :80，Mobile 前端 :81，
# 并将 /api/admin、/api/user 分别反向代理到两个后端服务。
#
# 日志：コンテナ内の /var/log/nginx に出力する。NAS 側の logs/frontend/ を
# ここへマウントするため、ホスト側で <发布位置>/logs/frontend/study21-access.log として読める。
# $http_referer を記録するので、SPA の画面遷移後に発生した API 呼び出しについては
# 「どの画面から来たか」（= 直前の URL）も追える。
#
# 上流の再解決（重要・502 対策）：
# nginx は設定を読み込んだ時点で上流名を一度だけ解決し、その結果を保持し続ける。
# そのため `proxy_pass http://admin-api:8081;` のように固定で書くと、
# 「後端コンテナだけを作り直した」場合に古い IP を掴んだままになり、
# 前端は 502 Bad Gateway を返し続ける（web コンテナを作り直すまで直らない）。
# ここでは Docker 組み込み DNS（127.0.0.11）を resolver に指定し、proxy_pass には
# 変数を使うことで、TTL（valid=10s）ごとに上流を解決し直す。

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

log_format study21 '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
access_log /var/log/nginx/study21-access.log study21;
error_log  /var/log/nginx/study21-error.log warn;

# 上流は変数で渡す（再解決のため）。proxy_pass に URI を書かなければ、
# クライアントから来た URI（クエリ文字列込み）がそのまま転送される。
# 各 location の先頭に set を置くのは rewrite フェーズ = proxy_pass より前だから。

# ---- PC 前端 ----
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/admin/ {
        set $study21_admin_upstream admin-api:8081;
        proxy_pass http://$study21_admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
    }

    location /api/user/ {
        set $study21_user_upstream user-api:8082;
        proxy_pass http://$study21_user_upstream;
        # ゲーム対戦の SSE（/api/user/games/stream）を通すため、バッファリングを切って
        # 長い接続を許可する。切らないとイベントがまとめて送られてしまう。
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
    }
}

# ---- Mobile 前端 ----
server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html/m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/admin/ {
        set $study21_admin_upstream admin-api:8081;
        proxy_pass http://$study21_admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
    }

    location /api/user/ {
        set $study21_user_upstream user-api:8082;
        proxy_pass http://$study21_user_upstream;
        # ゲーム対戦の SSE（/api/user/games/stream）を通すため、バッファリングを切って
        # 長い接続を許可する。切らないとイベントがまとめて送られてしまう。
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
    }
}
