<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study 2.1 ブラウザ記録 - 設定</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main class="settings-panel">
    <header>
      <h1>Study 2.1 ブラウザ記録 - 設定</h1>
      <p>
        接続コードは Study 2.1 の「インターネット利用履歴 → Web閲覧履歴」画面で発行できます。
        ここで入力した接続コードは、閲覧履歴の送信時に
        <code>X-Study21-Extension-Token</code> ヘッダーとして送られます。
      </p>
    </header>

    <label for="apiBaseUrl">API の URL</label>
    <input id="apiBaseUrl" type="text" placeholder="例: http://192.168.0.100:8082" autocomplete="off" spellcheck="false" />

    <label for="accessCode">接続コード</label>
    <input id="accessCode" type="text" placeholder="例: A1B2C3D4E5F6" autocomplete="off" spellcheck="false" />

    <label for="deviceName">端末名</label>
    <input id="deviceName" type="text" placeholder="例: LIU-PC" autocomplete="off" />

    <label class="checkbox-row" for="recordingEnabled">
      <input id="recordingEnabled" type="checkbox" />
      <span>閲覧履歴を記録する</span>
    </label>

    <div class="actions">
      <button id="saveBtn" class="primary" type="button">保存</button>
      <button id="testBtn" type="button">接続テスト</button>
      <button id="openWordbookBtn" type="button">単語帳を開く</button>
    </div>

    <div id="status" class="status"></div>

    <section class="info-block">
      <h2>この端末の情報</h2>
      <div class="info-row">
        <span class="info-label">端末 ID</span>
        <span id="deviceId" class="info-value mono">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">拡張機能</span>
        <span id="extensionVersion" class="info-value mono">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">送信待ち</span>
        <span id="pendingCount" class="info-value">0 件</span>
      </div>
      <div class="info-row">
        <span class="info-label">最終送信</span>
        <span id="lastSentAt" class="info-value">—</span>
      </div>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
