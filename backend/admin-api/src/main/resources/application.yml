spring:
  application:
    name: admin-api
  main:
    banner-mode: "off"
  datasource:
    url: ${STUDY21_DATASOURCE_URL:jdbc:postgresql://192.168.0.100:54320/study21}
    username: ${STUDY21_DATASOURCE_USERNAME:postgres}
    password: ${STUDY21_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${ADMIN_API_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ログの出力先・フォーマット・ローテーションは
# backend/common-core/src/main/resources/logback-spring.xml に集約している
# （app / sql / error の 3 ファイル、日次 + サイズでローテーション）。

app:
  system-name: "Study 2.1"
  version: "0.1.0"
  service-name: "admin-api"
  environment: "${APP_ENV:development}"

study21:
  cors:
    allowed-origins: "${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}"
  log:
    # 出力先。コンテナ内は /app/logs（NAS 側の logs/ をマウントする）。
    dir: ${STUDY21_LOG_DIR:logs}
    # 通常ログ（<service>-app.log）のレベル。
    level: ${STUDY21_LOG_LEVEL:INFO}
    # DB 操作ログ（<service>-sql.log）のレベル。0 にしたい場合は OFF。
    sql-level: ${STUDY21_SQL_LOG_LEVEL:INFO}
    # 過去ログの保持日数（archive/ に gzip で退避）。
    retention-days: ${STUDY21_LOG_RETENTION_DAYS:90}
    # 1 ファイルの上限サイズ。超えたらローテーション。
    max-file-size: ${STUDY21_LOG_MAX_FILE_SIZE:100MB}
