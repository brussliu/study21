spring:
  application:
    name: admin-api
  main:
    banner-mode: "off"
  datasource:
    url: ${STUDY21_DATASOURCE_URL:jdbc:postgresql://192.168.0.100:54320/study21}
    username: ${STUDY21_DATASOURCE_USERNAME:postgres}
    password: ${STUDY21_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${ADMIN_API_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{traceId:-}] %c{1} - %m%n"

app:
  system-name: "Study 2.1"
  version: "0.1.0"
  service-name: "admin-api"
  environment: "${APP_ENV:development}"

study21:
  cors:
    allowed-origins: "${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}"
