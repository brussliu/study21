# ============================================================================
# 実 DB 統合試験のプロファイル（`@ActiveProfiles("testdb")`）
# ----------------------------------------------------------------------------
# **日常の開発 DB には繋がない**。専用の使い捨て PostgreSQL を指す URL が
# 環境変数で渡されたときだけ有効になる（無いときはテスト側が skip する）。
#   用意: tmp/tools/study21-batchtestdb.sh start
#   実行: STUDY21_TEST_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:55433/study21_test \
#         tmp/tools/mvn-test.sh test
# ============================================================================
spring.datasource.url=${STUDY21_TEST_DATASOURCE_URL}
spring.datasource.username=${STUDY21_TEST_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${STUDY21_TEST_DATASOURCE_PASSWORD:}

# 起動時の副作用（自動運転）を**明示的に止める**。遅延で逃げない。
#   定期実行（30 秒検査）／起動時バッチ／起動時の自動復旧の 3 つ。
#   業務の入口（BatchService#runOnStartup・BatchExecutionRecovery#recoverInterruptedExecutions など）は
#   そのまま呼べるので、テストは必要なときだけ明示的に呼ぶ。
study21.batch.auto-run.schedule-enabled=false
study21.batch.auto-run.startup-enabled=false
study21.batch.auto-run.recovery-enabled=false
