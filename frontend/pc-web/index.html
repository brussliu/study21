<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study 2.1</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('study21-theme')
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.dataset.theme = theme
          }
        } catch (_e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
