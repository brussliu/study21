<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Study 2.1">
  <!-- Study 2.1 システムアイコン（maskable 版）。
       Android 等のマスク（円・角丸）で切り取られても欠けないよう、
       背景を全面ベタ塗りにし、図形をセーフゾーン（中央 80%）内に収めている。
       apple-touch-icon の生成元もこのファイル。 -->
  <defs>
    <linearGradient id="study21-icon-maskable-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a8a72" />
      <stop offset="1" stop-color="#4cb39a" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="url(#study21-icon-maskable-grad)" />
  <g transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <path d="M16 24 L32 30 L32 48 L16 42 Z" fill="#bce4d8" />
    <path d="M48 24 L32 30 L32 48 L48 42 Z" fill="#e6f4ef" />
    <circle cx="32" cy="22.5" r="5.2" fill="#ffffff" />
  </g>
</svg>
